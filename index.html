<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* This centers everything on the screen */
  .container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;       /* Take up full screen height */
    gap: 60px;               /* Space between buttons */
    font-family: sans-serif;
  }

  .btn {
    font-size: 24px;         /* Larger text for thumbs */
    padding: 20px 40px;      /* Larger hit area */
    width: 80%;              /* Buttons take up most of the width */
    max-width: 300px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid #ccc;
    background-color: #f0f0f0;
  }
</style>
</head>
<body>

<div class="container">

  <a href="https://1drv.ms/v/c/fb2af1ffe9f5964a/IQC1mJbIyQ4bS7RnlgZreBc1AYAv4XzO42m5TZeeCYHCRwE?e=20w17w" target="_blank" rel="noopener">
    <button class="btn">▶ Play Video</button>
  </a>

  <a href="https://1drv.ms/w/c/fb2af1ffe9f5964a/IQANiDGpQceLSpj00M6TZCKmATI4gQdr3JnELjNYrtdfW3I" target="_blank">
    <button class="btn">View Document</button>
  </a>

</div>

</body>
</html>
